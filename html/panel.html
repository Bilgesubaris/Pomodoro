<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bireysel Çalışma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/anasayfa.css">
  <link rel="stylesheet" href="../css/panel.css">
  <link
  rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Üst Menü -->
  <nav class="navbar navbar-expand-lg navbar-light shadow-sm mb-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="panel.html">🎯 Bireysel Çalışma</a>
      <div class="d-flex align-items-center gap-2">
        <a href="calismalar.html" class="btn btn-outline-primary btn-sm"><i class="bi bi-journal-text me-1"></i> Önceki Çalışmalar</a>
        <button id="logoutBtn" type="button" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right me-1"></i> Çıkış Yap</button>
        <span id="userName" class="text-secondary small ms-2"></span>
      </div>
    </div>
  </nav>

  <!-- Hero Banner -->
  <section class="container">
    <div class="glass-banner p-4 p-md-5 rounded-4 mb-4 d-flex flex-column flex-md-row align-items-center justify-content-between">
      <div>
        <h2 class="fw-bold mb-1">Odaklan, hedeflerine ulaş</h2>
        <p class="mb-0 text-muted">Pomodoro ile planlı ilerle, molalarda enerjini tazele.</p>
      </div>
      <div class="d-none d-md-block">
        <i class="bi bi-hourglass-split display-4 text-primary"></i>
      </div>
    </div>
  </section>

  <div class="container py-4">
    <!-- Başlık ve Ayarlar Satırı -->
    <div class="row g-3 align-items-end mb-3">
      <div class="col-md-6 focus-hide">
        <label for="sessionTitle" class="form-label mb-1">Çalışma Başlığı</label>
        <input id="sessionTitle" type="text" class="form-control" placeholder="Örn: Algoritma Çalışması">
      </div>
      
    </div>

    <!-- Süre Ayarları -->
    <div class="row justify-content-center mb-4 focus-hide">
      <div class="col-lg-8">
        <div class="p-4 rounded-4 shadow bg-white text-center glass-card">
          <h5 class="fw-bold mb-3">Süre Ayarları</h5>
          <form id="timerSettings" class="row g-3 align-items-center justify-content-center">
            <div class="col-12 col-md-3">
              <label for="pomodoroInput" class="form-label mb-1">Pomodoro (dk)</label>
              <input type="number" min="1" max="120" class="form-control" id="pomodoroInput" value="25">
            </div>
            <div class="col-12 col-md-3">
              <label for="shortBreakInput" class="form-label mb-1">Kısa Mola (dk)</label>
              <input type="number" min="1" max="60" class="form-control" id="shortBreakInput" value="5">
            </div>
            <div class="col-12 col-md-3">
              <label for="longBreakInput" class="form-label mb-1">Uzun Mola (dk)</label>
              <input type="number" min="1" max="60" class="form-control" id="longBreakInput" value="15">
            </div>
            <div class="col-12 col-md-3">
              <label class="form-label mb-1">&nbsp;</label>
              <button type="submit" class="btn btn-primary w-100"><i class="bi bi-save2 me-1"></i> Kaydet</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Zamanlayıcı -->
    <div class="row justify-content-center mb-4">
      <div class="col-lg-8 col-12">
        <div id="timerCard" class="p-4 rounded-4 shadow-lg bg-gradient text-center d-flex flex-column align-items-center justify-content-center">
          <h2 class="fw-bold mb-2">Pomodoro Zamanlayıcı</h2>
          <div class="timer-wrapper mb-3">
            <svg class="progress-ring" width="240" height="240">
              <circle class="progress-ring__bg" cx="120" cy="120" r="100" />
              <circle class="progress-ring__progress" cx="120" cy="120" r="100" />
            </svg>
            <div id="timer" class="display-1 fw-bold">25:00</div>
          </div>
          <div class="d-flex gap-2 justify-content-center mb-2">
            <button class="btn btn-success btn-lg px-4" id="startBtn"><i class="bi bi-play-fill me-1"></i> Başlat</button>
            <button class="btn btn-warning btn-lg px-4" id="pauseBtn"><i class="bi bi-pause-fill me-1"></i> Duraklat</button>
            <button class="btn btn-secondary btn-lg px-4" id="resetBtn"><i class="bi bi-arrow-counterclockwise me-1"></i> Sıfırla</button>
          </div>
          <div class="mt-1">
            <button class="btn btn-outline-info btn-sm" id="breakBtn"><i class="bi bi-cup-hot me-1"></i> Kısa Mola</button>
            <button class="btn btn-outline-primary btn-sm" id="longBreakBtn"><i class="bi bi-cup-straw me-1"></i> Uzun Mola</button>
          </div>
          <button id="saveSessionBtn" class="btn btn-primary mt-3"><i class="bi bi-cloud-arrow-up me-1"></i> Çalışmayı Kaydet</button>
        </div>
      </div>
    </div>

    <!-- İstatistikler -->
    <div class="row g-3 mb-3 focus-hide">
      <div class="col-md-4">
        <div class="stats-card rounded-4 p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <div class="text-uppercase small text-muted">Toplam Çalışma</div>
              <div id="totalSessionsValue" class="fs-3 fw-bold">0</div>
            </div>
            <i class="bi bi-journal-text fs-1 text-primary"></i>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stats-card rounded-4 p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <div class="text-uppercase small text-muted">Tamamlanan Görev</div>
              <div id="completedTasksValue" class="fs-3 fw-bold">0</div>
            </div>
            <i class="bi bi-check2-circle fs-1 text-success"></i>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stats-card rounded-4 p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <div class="text-uppercase small text-muted">Son Kayıt</div>
              <div id="lastSessionValue" class="fs-6 fw-semibold text-muted">-</div>
            </div>
            <i class="bi bi-clock-history fs-1 text-warning"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Görevler ve Notlar -->
    <div class="row g-4 focus-hide">
      <div class="col-lg-6">
        <div class="p-4 rounded-4 shadow bg-white h-100 glass-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Görev Listesi</h5>
            <div class="d-flex gap-2">
              <input id="newTaskInput" type="text" class="form-control" placeholder="Yeni görev ekle...">
              <button id="addTaskBtn" class="btn btn-success"><i class="bi bi-plus-circle me-1"></i> Ekle</button>
            </div>
          </div>
          <ul id="taskList" class="list-group"></ul>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="p-4 rounded-4 shadow bg-white h-100 glass-card">
          <h5 class="fw-bold mb-3">Notlar</h5>
          <textarea id="notesArea" class="form-control" rows="10" placeholder="Çalışma notlarını buraya yaz..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-light text-center text-lg-start mt-5 border-top pt-3 pb-2 footer-glass">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
      <span class="text-muted mb-2 mb-md-0">© 2025 Pomodoro | Hazırlayan: Bilgesu Barış</span>
      <span>
        <a href="#" class="text-muted me-3"><i class="bi bi-github"></i></a>
        <a href="#" class="text-muted me-3"><i class="bi bi-twitter"></i></a>
        <a href="#" class="text-muted"><i class="bi bi-linkedin"></i></a>
      </span>
    </div>
  </footer>

  <script type="module" src="../js/panel.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
